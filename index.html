<!doctype html>
<html lang="en">
<head>

<title>moth-lantern</title>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: page strip on the left, drawing desk in the middle, notes drawer under it.
   Palette: paper + non-photo blue (the pencil manga artists rough a name in). */
:root {
  --bg: #f3f2ee;
  --panel: #fbfaf7;
  --line: #d9d6cd;
  --fg: #1c1d21;
  --muted: #6b6e76;
  --accent: #2f64d6;
  --accent-ink: #ffffff;
  --desk: #c9cdd6;
  --danger: #c4372f;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f25; --line: #2d323b; --fg: #e8eaee; --muted: #9aa1ad;
    --accent: #7aa2ff; --accent-ink: #0d1526; --desk: #0e1013; --danger: #ff7b72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f25; --line: #2d323b; --fg: #e8eaee; --muted: #9aa1ad;
  --accent: #7aa2ff; --accent-ink: #0d1526; --desk: #0e1013; --danger: #ff7b72; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; overflow: hidden;
}
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: 128px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px 14px; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.shell { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.view { min-height: 0; min-width: 0; }
.view[hidden] { display: none; }
.gtop { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex: none; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.logo img { width: 34px; height: 34px; border-radius: 9px; display: block; }
.gtop .tabs { display: flex; gap: 6px; flex: none; }
.gtop .tabs[hidden], .gtop .projchip[hidden] { display: none; }
.gtop .tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gtop .projchip { font-weight: 600; flex: none; }
.gtop .gap { margin-left: auto; }
.choose h2 { font-family: var(--font-display); font-size: 22px; margin: 6px 0 4px; }
.choose p.sub { margin: 0 0 16px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; max-width: 900px; }
.card { text-align: left; border: 1px solid var(--line); border-left: 8px solid var(--pc); border-radius: 12px; background: var(--panel); padding: 18px 18px 20px; cursor: pointer; min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card b { font-family: var(--font-display); font-size: 19px; }
.card span { color: var(--muted); font-size: 13px; }
.card.cur { box-shadow: 0 0 0 2px var(--accent); }
.btn[hidden], .lbar [hidden], .roster[hidden], .grp-items[hidden], .lightbox [hidden] { display: none !important; }
.lib { display: flex; flex-direction: column; gap: 8px; }
.lib[hidden] { display: none; }
.lbar { display: flex; align-items: center; gap: 8px; flex: none; overflow-x: auto; }
.lbar .grow, .lhead .grow { flex: 1; }
.lbar .lstat { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; border: 0; background: none; padding: 6px 4px; }
.lbar .lstat.err { color: var(--danger); text-decoration: underline; cursor: pointer; }
.lbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; }
.lbody.refs { display: block; overflow-y: auto; }
.llist { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.llist .btn { justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; text-align: left; width: 100%; flex: none; }
.llist .btn[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ledit { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.lhead { display: flex; align-items: center; gap: 8px; flex: none; }
.lhead b { font-family: var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltext { flex: 1; min-height: 0; width: 100%; box-sizing: border-box; resize: none; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; font: 15px/1.55 var(--font-body); padding: 12px 14px; }
.lib { --pa: var(--accent); --serif: "Cormorant Garamond", "Palatino Linotype", Georgia, serif; }
.lread { flex: 1; min-height: 0; overflow: auto; padding: 4px 2px 40px; line-height: 1.6; font-size: 16px; scroll-behavior: smooth; }
.lread[hidden], .ltext[hidden] { display: none; }
.doc { max-width: 800px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.dhead { display: grid; gap: 6px; }
.dhead h2 { font: 600 2rem/1.1 var(--serif); margin: 0; letter-spacing: .01em; }
.dhead .flame { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 55%, var(--pa) 0 26%, color-mix(in srgb, var(--pa) 35%, transparent) 46%, transparent 70%); }
.dintro { margin: 0; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 0 14px; font: 600 14px var(--font-body); cursor: pointer; }
.chip.on { border-color: var(--pa); background: color-mix(in srgb, var(--pa) 16%, transparent); }
.dsec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px 18px; scroll-margin-top: 8px; min-width: 0; }
.dsec > :last-child { margin-bottom: 0; }
.doc h3, .csn { font: 600 1.4rem/1.2 var(--serif); margin: 0 0 8px; }
.doc .sech { padding-bottom: 8px; border-bottom: 2px solid color-mix(in srgb, var(--pa) 40%, transparent); margin-bottom: 12px; }
.doc h4 { font: 500 .74rem/1.3 ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
.doc p { margin: 0 0 .7em; max-width: 72ch; }
.doc ul, .doc ol { margin: 0 0 .7em; padding-left: 22px; display: grid; gap: 5px; }
.doc li > ul, .doc li > ol { margin: 5px 0 0; }
.doc blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--pa); color: var(--muted); }
.doc code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.doc hr { border: 0; border-top: 1px solid var(--line); }
.tbl { overflow-x: auto; margin: 0 0 .8em; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 500 .72rem ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ideas { display: grid; gap: 10px; }
.idea { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 12px 16px; display: grid; gap: 8px; min-width: 0; }
.idea.done { opacity: .72; }
.imeta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.itopic { color: var(--c); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.itext p, .ians p { margin: 0 0 .5em; }
.ians { background: color-mix(in srgb, var(--c) 8%, var(--bg)); border-radius: 8px; padding: 10px 14px; display: grid; }
.elab { font: 500 .72rem ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.tl { position: relative; display: grid; gap: 8px; }
.tl::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tli { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; }
.tli .dot { width: 12px; height: 12px; margin: 14px 0 0 5px; border-radius: 50%; background: var(--panel); border: 2px solid var(--pa); box-sizing: border-box; z-index: 1; }
.tli.guess .dot { border-style: dashed; }
.tli.ev .tlb { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; min-width: 0; }
.tli.guess .tlb { border-style: dashed; }
.tli.era { margin-top: 14px; }
.tli.era .dot { width: 14px; height: 14px; margin: 10px 0 0 4px; border: 0; border-radius: 3px; background: var(--pa); transform: rotate(45deg); }
.tle { font: 600 1.45rem/1.2 var(--serif); }
.tlt { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.when { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.tlh { font-weight: 600; overflow-wrap: anywhere; }
.tln { margin: 0; color: var(--muted); font-size: 14.5px; }
.cpick { display: grid; gap: 8px; }
.glab { font: 500 .72rem ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px; }
.csheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; display: grid; gap: 10px; min-width: 0; }
.csn { font-size: 1.7rem; margin: 0; }
.aka { margin: 0; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { border: 1px solid var(--pa); color: var(--pa); border-radius: 999px; padding: 2px 11px; font: 600 13px var(--font-body); }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 18px; margin: 4px 0 0; }
dl.facts dt { font: 500 .72rem/1.9 ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dl.facts dd { margin: 0; }
@media (max-width: 600px) { dl.facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.facts dd { margin-bottom: 8px; } .dsec { padding: 14px 14px 16px; } }
.lnone { color: var(--muted); padding: 24px 4px; }
.lfilter { width: 100%; max-width: 420px; box-sizing: border-box; min-height: 44px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--panel); color: inherit; font: inherit; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding-bottom: 12px; }
.gi { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0; cursor: pointer; aspect-ratio: 1; overflow: hidden; }
.gi img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gi span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; background: rgba(20,22,26,.78); color: #fff; font-size: 11px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(8,9,11,.94); display: flex; flex-direction: column; padding: 10px; gap: 8px; box-sizing: border-box; }
.lightbox[hidden] { display: none; }
.lightbox .lbtop { display: flex; gap: 8px; align-items: center; color: #e8eaee; }
.lightbox .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.45); font-weight: 600; }
.lightbox .btn.danger { background: #c4372f; border-color: #e5645c; color: #fff; }
.lightbox .btn.danger.armed { background: #ff4d42; border-color: #fff; color: #fff; }
.lightbox .lbtop b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox .lbimg { flex: 1; min-height: 0; display: grid; place-items: center; overflow: auto; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
@media (max-width: 720px) { .lbody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .llist { flex-direction: row; overflow-x: auto; } .llist .btn { width: auto; flex: none; max-width: 180px; } }
.empty { max-width: 560px; margin: 40px auto; text-align: center; color: var(--muted); }
.empty h2 { font-family: var(--font-display); color: var(--fg); margin: 0 0 8px; }
.actions { display: flex; gap: 8px; flex: none; max-width: 100%; overflow-x: auto; }
.actions .btn { justify-content: center; flex: none; }
#undo, #redo { min-width: 92px; }
#clean { min-width: 176px; }
#del { min-width: 176px; }
.status { margin-right: auto; width: 230px; max-width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px 4px; min-height: 36px; }
.status.err { color: var(--danger); text-decoration: underline; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:focus-visible, .thumb:focus-visible, .status:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"], .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.sw { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); flex: none; }
.sw.sq { border-radius: 2px; background: transparent; box-shadow: inset 0 0 0 2.5px var(--c); }

.pages { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding-bottom: 6px; }
.thumb { position: relative; flex: none; border: 2px solid var(--line); border-radius: 6px; background: #fff; padding: 0; cursor: pointer; aspect-ratio: 4 / 5; overflow: hidden; width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.thumb[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.thumb .tn { position: absolute; left: 4px; bottom: 4px; min-width: 22px; padding: 1px 6px; border-radius: 10px; background: rgba(20,22,26,.78); color: #fff; font-size: 12px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.addpage { flex: none; min-height: 44px; justify-content: center; border-style: dashed; }
.pnlayer { position: absolute; inset: 0; pointer-events: none; }
.pnl { position: absolute; box-sizing: border-box; }
.pnl.on { outline: 2px solid #2f64d6; outline-offset: -1px; background: rgba(47, 100, 214, .06); }
.pnl-tag { position: absolute; left: 6px; top: 6px; pointer-events: auto; min-height: 30px; padding: 0 11px; border-radius: 15px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,.5); background: rgba(20,22,26,.78); color: #fff; cursor: pointer; }
.pnl.on .pnl-tag { background: #2f64d6; }
.pcard { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.pcard.on { border-color: var(--accent); }
.pcard input, .pcard textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); color: inherit; font: inherit; font-size: 16px; }
.pcard textarea { min-height: 70px; resize: vertical; }
.pcard .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.compbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: none; }
.complab { font: 500 11px ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
.cchip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg); font: 600 13px var(--font-body); cursor: pointer; }
.cchip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.cchip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--panel)); box-shadow: 0 0 0 1px var(--c); }
.charsel, .dock-edit select { min-height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--panel); color: inherit; font: inherit; font-size: 14px; max-width: 220px; }
.app.dock-open { grid-template-columns: 128px minmax(0, 1fr) 300px; }
.dock { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.dock[hidden] { display: none; }
.dock-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
.dock-head b { flex: 1; font-family: var(--font-display); }
.dock-head .btn { min-height: 36px; padding: 0 12px; }
.dock-list { flex: 1 1 40%; min-height: 120px; overflow-y: auto; padding: 8px; display: grid; gap: 4px; align-content: start; }
.dock-edit { flex: 0 1 auto; max-height: 55%; overflow-y: auto; border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; }
.lgrp { display: flex; align-items: baseline; gap: 8px; width: 100%; min-height: 36px; margin-top: 6px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); text-align: left; cursor: pointer; }
.lgrp small { color: var(--muted); margin-left: auto; }
.lgrp[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.lrow { display: grid; grid-template-columns: 30px 10px minmax(0, 1fr) 34px 34px; align-items: center; gap: 4px; padding: 2px 4px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
.lrow.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.lrow .ltxt { display: grid; min-width: 0; }
.lrow .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 14px; }
.lrow small { color: var(--muted); font-size: 11px; }
.ldot { width: 10px; height: 10px; border-radius: 50%; }
.leye, .lmv { min-height: 34px; min-width: 30px; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; }
.lnone2 { color: var(--muted); font-size: 13px; padding: 4px 8px; }
.lfield { display: grid; gap: 4px; }
.lflab { font: 500 11px ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.dock-edit input[type=text], .dock-edit textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: inherit; font: inherit; font-size: 16px; }
.dock-edit select { max-width: none; width: 100%; }
.dock-edit textarea { min-height: 96px; resize: vertical; }
.dock-edit .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.dock-edit .btn.ghost { min-height: 36px; padding: 0 10px; font-size: 13px; background: transparent; }
@media (max-width: 1000px) {
  .app.dock-open { grid-template-columns: 128px minmax(0, 1fr); }
  .dock { position: fixed; right: 0; top: 0; bottom: 0; width: min(340px, 92vw); z-index: 12; border-radius: 14px 0 0 14px; box-shadow: -8px 0 30px rgba(0,0,0,.4); grid-column: auto; grid-row: auto; }
}
@media (max-width: 720px) {
  .app.dock-open { grid-template-columns: minmax(0, 1fr); }
  .dock { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 58vh; border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.4); }
}
.cvwrap { position: relative; width: max-content; }
.guide { position: absolute; inset: 50px; border: 1.5px dashed rgba(70, 95, 150, .5); pointer-events: none; box-sizing: border-box; }
.guide[hidden] { display: none; }
.chapbtn { max-width: 260px; overflow: hidden; text-overflow: ellipsis; justify-content: center; flex: 0 1 auto; font-weight: 600; }
.thumbwrap { position: relative; flex: none; }
.thumbwrap .mv { position: absolute; right: 4px; width: 38px; height: 38px; min-height: 0; padding: 0; justify-content: center; border-radius: 19px; background: rgba(20,22,26,.85); color: #fff; border-color: rgba(255,255,255,.4); font-size: 16px; }
.thumbwrap .mv.up { top: 4px; } .thumbwrap .mv.dn { bottom: 4px; }
.thumbwrap .mv:disabled { opacity: .3; }
.reorder-on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pbtn .short { display: none; }

            '<section class="idea-tools" aria-label="Find ideas"><input type="search" id="search" placeholder="Search ideas" aria-label="Search ideas"><div class="chips" id="filter" role="group" aria-label="Filter by topic"></div></section><section class="ideas" id="ideas-list" aria-live="polite"></section></div>';
          composeEl = host.querySelector('.composer'); pickEl = host.querySelector('#topic-pick'); filterEl = host.querySelector('#filter'); listEl = host.querySelector('#ideas-list'); statusLine = host.querySelector('.sline');
          var ta = host.querySelector('#idea-text'), btn = host.querySelector('#add-btn'), s = host.querySelector('#search');
          ta.value = lsGet('ml-draft-' + pj, '') || ''; var dt; ta.addEventListener('input', function () { clearTimeout(dt); dt = setTimeout(function () { lsSet('ml-draft-' + pj, ta.value); }, 400); });
          btn.onclick = function () { addIdea(ta, btn); }; ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addIdea(ta, btn); } });
          s.addEventListener('input', function () { query = s.value; renderList(); });
          renderAll();
        }).catch(function (e) { ctx.fail(e, 'Could not load'); });
      },
      flush: function () { return saver.flush(); }, retry: function () { saver.flush(); }
    };
  }

  /* ----- plain files and the reference-image grid (the earlier file view) ----- */
  function pageLib(ctx) {
    var lib = null;
    return {
      render: function () {
        var h = mk('div', 'lib inner'); ctx.host.appendChild(h);
        lib = makeLib(h, ctx.def.k === 'refs' ? 'bible-refs' : (ctx.kind === 'bible' ? 'bible-notes' : 'notebook')); lib.show();
      },
      flush: function () { return lib ? lib.flush() : Promise.resolve(true); }
    };
  }

  /* ----- the hub: title, tabs, page ----- */
  function makeHub(root, kind) {
    var folder = kind === 'bible' ? 'bible' : 'notebook';
    var DEFS = kind === 'bible'
      ? [{ k: 'canon', label: 'Canon', file: 'canon.md', make: pageCanon }, { k: 'timeline', label: 'Timeline', file: 'timeline.md', make: pageTimeline },
         { k: 'characters', label: 'Characters', file: 'characters.md', make: pageCharacters }, { k: 'magic', label: 'Magic', file: 'magic.md', make: pageMagic },
         { k: 'files', label: 'Files', make: pageLib }, { k: 'refs', label: 'References', make: pageLib }]
      : [{ k: 'ideas', label: 'Ideas', file: 'ideas.md', always: true, make: pageIdeas }, { k: 'files', label: 'Files', make: pageLib }];
    root.innerHTML = '<header class="hhead"><span class="flame" aria-hidden="true"></span><h1 class="hname"></h1><p class="hsub"></p><div class="hrow"><button class="lstat" type="button"></button><button class="btn hconn" type="button" hidden>Connect Google Drive</button></div></header><nav class="htabs" aria-label="Pages"></nav><div class="hbody"></div>';
    var nameEl = root.querySelector('.hname'), subEl = root.querySelector('.hsub'), statEl = root.querySelector('.lstat'), connBtn = root.querySelector('.hconn'), tabsEl = root.querySelector('.htabs'), body = root.querySelector('.hbody');
    var listing = [], inst = null, token = 0;
    function status(t, err) { statEl.textContent = t; statEl.classList.toggle('err', !!err); }
    function fileByName(n) { for (var i = 0; i < listing.length; i++) if (listing[i].name === n) return listing[i]; return null; }
    function renderConnect(msg) {
      connBtn.hidden = false; status(''); tabsEl.textContent = ''; inst = null; body.className = 'hbody'; body.innerHTML = '<div class="lnone"></div>'; body.firstChild.textContent = msg || 'Connect Google Drive to open this project’s files.';
    }
    function fail(e, what) {
      var m = msgOf(e);
      if (/not connected|sign-in|token/i.test(m) && !gHave()) { renderConnect('Google Drive needs you to sign in again.'); return; }
      status((what || 'Failed') + ' (' + m + '). Tap to retry.', true);
    }
    function visible() { return DEFS.filter(function (d) { return !d.file || d.always || fileByName(d.file); }); }
    function buildTabs() {
      tabsEl.textContent = '';
      visible().forEach(function (d) { var b = bt(d.label, 'htab'); b.dataset.k = d.k; b.addEventListener('click', function () { openPage(d.k); }); tabsEl.appendChild(b); });
    }
    function markTab(k) { Array.prototype.forEach.call(tabsEl.children, function (b) { if (b.dataset.k === k) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); }
    function flushPage() { return inst && inst.flush ? inst.flush() : Promise.resolve(true); }
    function openPage(k) {
      var def = DEFS.filter(function (d) { return d.k === k; })[0]; if (!def) return Promise.resolve();
      return flushPage().then(function (ok) {
        if (!ok) return;
        lsSet('ml-tab-' + kind, k); markTab(k); body.textContent = ''; body.className = 'hbody' + (def.make === pageLib ? ' fill' : ''); body.scrollTop = 0; status('');
        inst = def.make({ kind: kind, def: def, host: body, folder: folder, file: fileByName, status: status, fail: fail });
        inst.render();
      });
    }
    function show() {
      var pj = projOf(proj); root.style.setProperty('--pa', pj.color); nameEl.textContent = pj.name;
      subEl.textContent = kind === 'bible' ? 'The story bible: everything settled so far, kept as files in your Google Drive.' : 'Your ideas for this story. Claude reads new ideas at the start of every story session and marks each one Processed.';
      if (!gHave()) { renderConnect(); return; }
      connBtn.hidden = true; status('Loading…'); var tok = ++token;
      folderPath([DRIVE_ROOT, proj, folder]).then(listFiles).then(function (list) {
        if (tok !== token) return; listing = list; status(''); buildTabs();
        var vis = visible(), want = lsGet('ml-tab-' + kind, null), k = vis.some(function (d) { return d.k === want; }) ? want : vis[0].k;
        return openPage(k);
      }).catch(function (e) { fail(e, 'Could not load'); });
    }
    statEl.addEventListener('click', function () { if (!statEl.classList.contains('err')) return; if (inst && inst.retry) inst.retry(); else show(); });
    connBtn.addEventListener('click', function () { status('Signing in…'); gConnect().then(show).catch(function (e) { renderConnect('Sign-in did not finish (' + msgOf(e) + '). Tap Connect to try again.'); }); });
    return { show: show, flush: flushPage };
  }
  /* ---------- chapters: pick which chapter's pages the sketchbook shows ---------- */
  function updateChapterBtn() { var b = document.getElementById('chapbtn'); if (b && proj) b.textContent = chapterName(proj, chapter) + ' ▾'; }
  function saveMeta(k, m) {
    var r = metaRow(k); if (!r) { r = { id: k + '-meta', order: 0, assetId: null, height: DEFAULT_H, notes: '' }; allPages.push(r); }
    r.notes = JSON.stringify({ v: 1, list: m.list, names: m.names }); queue(function () { return writeDoc(r); });
  }
  function loadChapter(ch) {
    chapter = ch; try { localStorage.setItem('ml-chap-' + proj, String(ch)); } catch (e) {}
    pages = pagesOfChapter(proj, ch);
    if (!pages.length) { var p = { id: pid(proj, ch, 1), order: 1, assetId: null, height: DEFAULT_H, notes: '' }; pages.push(p); allPages.push(p); queue(function () { return writeDoc(p); }); }
    cur = -1; docFresh(); canDraw = false; dirty = false; reorderMode = false; updateChapterBtn();
    return openPage(0).then(function () { if (!statusEl.classList.contains('err')) setStatus(db && assets ? 'Ready. Saves automatically.' : 'Saving is off here. Use Save PNG.'); });
  }
  function openChapter(ch) {
    return flush().then(function () { if (dirty || ch === chapter) return; cacheLeaving(); return loadChapter(ch); });
  }
  function closeX(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
  function openPanel(title) {
    var o = document.createElement('div'); o.className = 'xpanel'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', title);
    o.innerHTML = '<div class="xcard"><div class="xhead"><b></b><button class="btn" type="button" data-x="close">Close</button></div><div class="xbody"></div><div class="xfoot" hidden></div></div>';
    o.querySelector('b').textContent = title;
    o.addEventListener('click', function (e) { if (e.target === o || (e.target.closest && e.target.closest('[data-x=close]'))) closeX(o); });
    document.body.appendChild(o); return o;
  }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || (lbEl && !lbEl.hidden)) return;
    var ps = document.querySelectorAll('.xpanel'); if (ps.length) closeX(ps[ps.length - 1]);
  });
  function showChapters() {
    flush().then(function () {
      if (dirty || !proj) return;
      var m = getMeta(proj), o = openPanel('Chapters · ' + projOf(proj).name), body = o.querySelector('.xbody'), foot = o.querySelector('.xfoot'); foot.hidden = false;
      var list = mk('div', 'xlist');
      m.list.forEach(function (n) {
        var all = pagesOfChapter(proj, n), drawn = all.filter(function (p) { return p.assetId; }).length;
        var b = mk('button', 'btn' + (n === chapter ? ' on' : '')); b.type = 'button';
        b.append(mk('span', '', chapterName(proj, n, m)), mk('small', '', all.length + (all.length === 1 ? ' page' : ' pages') + (drawn ? '' : ' · empty')));
        b.addEventListener('click', function () { closeX(o); openChapter(n); }); list.appendChild(b);
      });
      body.appendChild(list);
      var nw = bt('+ New chapter', 'btn'), rn = bt('Rename this chapter', 'btn'), dl = bt('Delete this chapter', 'btn danger');
      var chPages = pagesOfChapter(proj, chapter), blank = chPages.every(function (p) { return !p.assetId; });
      dl.disabled = !(m.list.length > 1 && blank); dl.title = dl.disabled ? 'Only an empty chapter can be deleted (and you need at least one chapter)' : '';
      nw.onclick = function () { var n = m.list[m.list.length - 1] + 1; m.list.push(n); saveMeta(proj, m); closeX(o); openChapter(n); };
      rn.onclick = function () {
        var name = prompt('Name for ' + chapterName(proj, chapter, m) + ' (leave empty for no name)', m.names[chapter] || ''); if (name === null) return;
        name = name.trim(); if (name) m.names[chapter] = name; else delete m.names[chapter];
        saveMeta(proj, m); updateChapterBtn(); closeX(o); scheduleExport();
      };
      dl.onclick = function () {
        if (!dl.classList.contains('armed')) { dl.classList.add('armed'); dl.textContent = 'Tap again to delete'; setTimeout(function () { dl.classList.remove('armed'); dl.textContent = 'Delete this chapter'; }, 3500); return; }
        var n = chapter; pagesOfChapter(proj, n).forEach(function (p) { allPages.splice(allPages.indexOf(p), 1); queue(function () { return db ? db.doc('pages/' + p.id).delete() : null; }); });
        m.list = m.list.filter(function (x) { return x !== n; }); delete m.names[n]; saveMeta(proj, m);
        pages = []; cur = -1; dirty = false; docFresh(); closeX(o); loadChapter(m.list[0]);
      };
      foot.append(nw, rn, dl);
    });
  }
  document.getElementById('chapbtn').addEventListener('click', showChapters);

  /* ---------- copy the sketch pages into Drive, one folder per chapter, files in story order ----------
     moth-lantern/<project>/sketches/Chapter 01 - Name/001_p001.png ... plus pages.md (notes) and _state.json (so only changed pages are copied again).
     The real pages stay in Supabase. */
  var exporting = false, exportTimer = null;
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function safeName(s) { return String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 50); }
  function patchFile(f, body, mime) { return gfetch(UP + 'files/' + f.id + '?uploadType=media&fields=id', { method: 'PATCH', headers: { 'Content-Type': mime }, body: body }); }
  function patchMeta(id, fields, qs) { return gfetch(API + 'files/' + id + '?fields=id' + (qs || ''), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields) }); }
  function scheduleExport() { clearTimeout(exportTimer); if (gHave()) exportTimer = setTimeout(function () { exportSketches(false); }, 20000); }
  function chapterFolder(root, folders, n, fname) {
    var re = new RegExp('^Chapter 0*' + n + '(?!\\d)'), f = folders.filter(function (x) { return re.test(x.name); })[0];
    if (f) { if (f.name === fname) return Promise.resolve(f.id); return patchMeta(f.id, { name: fname }).then(function () { f.name = fname; return f.id; }); }
    return gfetch(API + 'files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: fname, mimeType: FOLDER_MIME, parents: [root] }) })
      .then(function (r) { return r.json(); }).then(function (j) { folders.push({ id: j.id, name: fname }); return j.id; });
  }
  function getComposite(p) {
    if (p.comp) return assets.download(p.comp);
    if (/\.json$/i.test(p.assetId)) return assets.download(p.assetId).then(function (b) { return b.text(); }).then(function (tx) { var m = JSON.parse(tx); p.mani = m; p.comp = m.composite; return assets.download(m.composite); });
    p.comp = p.assetId; return assets.download(p.assetId);
  }
  function exportSketches(manual) {
    if (exporting || !db || !assets || !gHave() || !proj) return Promise.resolve(false);
    exporting = true; var pj = proj, done = 0, m = getMeta(pj);
    var chapters = m.list.map(function (n) { return { n: n, pages: pagesOfChapter(pj, n) }; });
    function say(t) { if (manual) setStatus(t); }
    say('Exporting pages to Drive…');
    return folderPath([DRIVE_ROOT, pj, 'sketches']).then(function (root) {
      return Promise.all([listFiles(root), listChildFolders(root)]).then(function (a) {
        var rootFiles = a[0], folders = a[1], st = {}, byId = {}, all = rootFiles.map(function (f) { f._folder = root; return f; });
        return Promise.all(folders.map(function (fo) { return listFiles(fo.id).then(function (fs) { fs.forEach(function (f) { f._folder = fo.id; }); return fs; }); })).then(function (lists) {
          lists.forEach(function (l) { all = all.concat(l); });
          all.forEach(function (f) { var mm = /^(?:\d+_)?(.+)\.png$/.exec(f.name); if (mm) byId[mm[1]] = f; });
          var stFile = rootFiles.filter(function (f) { return f.name === '_state.json'; })[0], mdFile = rootFiles.filter(function (f) { return f.name === 'pages.md'; })[0];
          var loadSt = stFile ? readDoc(stFile).then(function (t) { try { st = JSON.parse(t) || {}; } catch (e) { st = {}; } }) : Promise.resolve();
          return loadSt.then(function () {
            var seq = Promise.resolve(), md = ['# ' + projOf(pj).name + ': sketchbook pages', '', 'Copied from the moth-lantern sketchbook on ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC. One folder per chapter; files are numbered in story order (001_..., 002_...). This is a read-only copy: the real pages live in the app.'];
            chapters.forEach(function (c) {
              var fname = 'Chapter ' + pad(c.n, 2) + (m.names[c.n] ? ' - ' + safeName(m.names[c.n]) : '');
              md.push('', '## ' + fname + ' (' + c.pages.length + (c.pages.length === 1 ? ' page)' : ' pages)'), '');
              seq = seq.then(function () { return chapterFolder(root, folders, c.n, fname); }).then(function (fid) {
                var s2 = Promise.resolve();
                c.pages.forEach(function (p, i) {
                  var want = pad(i + 1, 3) + '_' + p.id + '.png', old = byId[p.id];
                  md.push('### Page ' + (i + 1) + ' · ' + (p.assetId ? want : 'blank, not exported'), '', (p.notes || '').trim() || '(no notes)', '');
                  if (!p.assetId) return;
                  s2 = s2.then(function () {
                    var need = !old || st[p.id] !== p.assetId;
                    var step = need ? getComposite(p).then(function (blob) {
                      if (old) return patchFile(old, blob, 'image/png');
                      return createFile(fid, want, 'image/png', blob).then(function (nf) { nf._folder = fid; old = nf; byId[p.id] = nf; });
                    }) : Promise.resolve();
                    return step.then(function () {
                      if (need) { st[p.id] = p.assetId; done++; say('Exporting… ' + done); }
                      if (old.name !== want || old._folder !== fid) {
                        var qs = old._folder !== fid ? '&addParents=' + fid + '&removeParents=' + old._folder : '';
                        return patchMeta(old.id, { name: want }, qs).then(function () { old.name = want; old._folder = fid; });
                      }
                    });
                  });
                });
                return s2;
              });
            });
            return seq.then(function () {
              var keep = {}; allPages.forEach(function (p) { if (inProject(pj, p.id)) keep[p.id] = 1; });
              Object.keys(st).forEach(function (id) { if (!keep[id]) { delete st[id]; if (byId[id]) trashFile(byId[id].id).catch(function () {}); } });
              function put(name, ex, body, mime) { return ex ? patchFile(ex, body, mime) : createFile(root, name, mime, body); }
              return put('pages.md', mdFile, md.join('\n'), 'text/markdown').then(function () { return put('_state.json', stFile, JSON.stringify(st), 'application/json'); });
            });
          });
        });
      });
    }).then(function () { exporting = false; say(done ? 'Chapter saved: ' + done + ' page' + (done === 1 ? '' : 's') + ' copied to Drive.' : 'Chapter saved. The Drive copy is up to date.'); return true; })
      .catch(function (e) { exporting = false; say('Export failed (' + String(e && e.message || e).slice(0, 40) + ').'); return false; });
  }

  /* ---------- look at what has already been copied to Drive, chapter by chapter ---------- */
  function showExported() {
    var o = openPanel('Exported pages · ' + projOf(proj).name), body = o.querySelector('.xbody'), pj = proj;
    function note(t) { body.textContent = ''; body.appendChild(mk('div', 'xnote', t)); }
    function isPng(f) { return /\.png$/i.test(f.name); }
    function go() {
      note('Loading…');
      folderPath([DRIVE_ROOT, pj, 'sketches']).then(function (root) {
        return Promise.all([listFiles(root), listChildFolders(root)]).then(function (a) {
          return Promise.all(a[1].map(function (fo) { return listFiles(fo.id).then(function (fs) { return { title: fo.name, files: fs.filter(isPng) }; }); })).then(function (groups) {
            var loose = a[0].filter(isPng); if (loose.length) groups.push({ title: 'Not sorted into a chapter yet', files: loose });
            groups = groups.filter(function (g) { return g.files.length; });
            if (!groups.length) { note('Nothing has been exported yet. Tap ↑ Export to Drive first.'); return; }
            body.textContent = '';
            groups.forEach(function (g) {
              var sec = mk('div', 'xsec'), grid = mk('div', 'xgrid'), items = g.files.map(function (f) { return { label: g.title + ' · ' + f.name, f: f }; });
              sec.appendChild(mk('h4', '', g.title + ' · ' + g.files.length + (g.files.length === 1 ? ' page' : ' pages')));
              g.files.forEach(function (f, i) {
                var b = mk('button', 'gi'); b.type = 'button'; b.setAttribute('aria-label', 'Open ' + f.name);
                var im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; b.appendChild(im); thumbInto(im, f, 300); b.appendChild(mk('span', '', f.name.replace(/\.png$/i, '')));
                b.addEventListener('click', function () { openGallery(items, i); }); grid.appendChild(b);
              });
              sec.appendChild(grid); body.appendChild(sec);
            });
          });
        });
      }).catch(function (e) { note('Could not load (' + String(e && e.message || e).slice(0, 40) + ').'); });
    }
    if (gHave()) go();
    else { note('Connect Google Drive to see the exported pages.'); var cb = bt('Connect Google Drive', 'btn'); body.appendChild(cb); cb.onclick = function () { gConnect().then(go).catch(function () { note('Sign-in did not finish. Close this and try again.'); }); }; }
  }

  /* ---------- page strip buttons: reorder, export, exported pages ---------- */
  document.getElementById('pages').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('#exportbtn, #viewbtn, #reorderbtn') : null; if (!t) return;
    if (t.id === 'reorderbtn') { reorderMode = !reorderMode; renderThumbs(); return; }
    if (t.id === 'viewbtn') { flush().then(function () { showExported(); }); return; }
    flush().then(function () {
      if (gHave()) return exportSketches(true);
      setStatus('Signing in to Google…');
      return gConnect().then(function () { return exportSketches(true); }).catch(function () { setStatus('Drive sign-in did not finish.'); });
    });
  });

  /* ---------- margin guide: faint dashed line, only on screen (never saved into the page) ---------- */
  var guideEl = document.getElementById('guide'), guideBtn = document.getElementById('guidebtn'), GUIDE_M = 50, guideOn = true;
  try { guideOn = localStorage.getItem('ml-guide') !== '0'; } catch (e) {}
  function applyGuide() { if (!guideEl) return; guideEl.hidden = !guideOn; guideEl.style.inset = Math.round(GUIDE_M * zoom) + 'px'; guideBtn.setAttribute('aria-pressed', String(guideOn)); }
  guideBtn.addEventListener('click', function () { guideOn = !guideOn; try { localStorage.setItem('ml-guide', guideOn ? '1' : '0'); } catch (e) {} applyGuide(); });
  applyGuide();

  libs.notebook = makeHub(document.getElementById('v-notebook'), 'notebook');
  libs.bible = makeHub(document.getElementById('v-bible'), 'bible');
  window.addEventListener('pagehide', function () { Object.keys(libs).forEach(function (k) { libs[k].flush(); }); });

  /* ---------- sign in / boot ---------- */
  var loginEl = document.getElementById('login'), started = false;
  function showLogin(msg) { loginEl.hidden = false; document.getElementById('loginerr').textContent = msg || ''; }
  function boot(session) {
    if (started) return; started = true;
    uid = session.user.id; db = makeDb(); assets = makeAssets(); loginEl.hidden = true;
    var timer = setTimeout(function () { setStatus('Still reaching your saved pages…'); }, 10000);
    db.list().then(function (list) { clearTimeout(timer); start(list); })
      .catch(function (err) { clearTimeout(timer); db = null; setStatus('Could not reach saved pages (' + String(err && err.message || err).slice(0, 40) + '). Tap to retry.', true); start([]); });
  }
  document.getElementById('loginform').addEventListener('submit', function (e) {
    e.preventDefault(); document.getElementById('loginerr').textContent = 'Signing in…';
    sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function (r) {
      if (r.error) { showLogin(r.error.message); return; }
      boot(r.data.session);
    });
  });
  document.getElementById('signout').addEventListener('click', function () {
    flush().then(function () { return sb.auth.signOut(); }).then(function () { location.reload(); });
  });
  fit(); updateButtons(); renderThumbs();
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) boot(r.data.session); else showLogin(''); })
    .catch(function () { showLogin('Could not reach the server.'); });
})();
</script>
