<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moth-lantern</title>
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="moth-lantern">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: page strip on the left, drawing desk in the middle, notes drawer under it.
   Palette: paper + non-photo blue (the pencil manga artists rough a name in). */
:root {
  --bg: #f3f2ee;
  --panel: #fbfaf7;
  --line: #d9d6cd;
  --fg: #1c1d21;
  --muted: #6b6e76;
  --accent: #2f64d6;
  --accent-ink: #ffffff;
  --desk: #c9cdd6;
  --danger: #c4372f;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f25; --line: #2d323b; --fg: #e8eaee; --muted: #9aa1ad;
    --accent: #7aa2ff; --accent-ink: #0d1526; --desk: #0e1013; --danger: #ff7b72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f25; --line: #2d323b; --fg: #e8eaee; --muted: #9aa1ad;
  --accent: #7aa2ff; --accent-ink: #0d1526; --desk: #0e1013; --danger: #ff7b72; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; overflow: hidden;
}
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: 128px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px 14px; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.shell { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.view { min-height: 0; min-width: 0; }
.view[hidden] { display: none; }
.gtop { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex: none; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.logo img { width: 34px; height: 34px; border-radius: 9px; display: block; }
.gtop .tabs { display: flex; gap: 6px; flex: none; }
.gtop .tabs[hidden], .gtop .projchip[hidden] { display: none; }
.gtop .tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gtop .projchip { font-weight: 600; flex: none; }
.gtop .gap { margin-left: auto; }
.choose h2 { font-family: var(--font-display); font-size: 22px; margin: 6px 0 4px; }
.choose p.sub { margin: 0 0 16px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; max-width: 900px; }
.card { text-align: left; border: 1px solid var(--line); border-left: 8px solid var(--pc); border-radius: 12px; background: var(--panel); padding: 18px 18px 20px; cursor: pointer; min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card b { font-family: var(--font-display); font-size: 19px; }
.card span { color: var(--muted); font-size: 13px; }
.card.cur { box-shadow: 0 0 0 2px var(--accent); }
.btn[hidden], .lbar [hidden] { display: none; }
.lib { display: flex; flex-direction: column; gap: 8px; }
.lib[hidden] { display: none; }
.lbar { display: flex; align-items: center; gap: 8px; flex: none; overflow-x: auto; }
.lbar .grow, .lhead .grow { flex: 1; }
.lbar .lstat { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; border: 0; background: none; padding: 6px 4px; }
.lbar .lstat.err { color: var(--danger); text-decoration: underline; cursor: pointer; }
.lbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; }
.lbody.refs { display: block; overflow-y: auto; }
.llist { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.llist .btn { justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; text-align: left; width: 100%; flex: none; }
.llist .btn[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ledit { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.lhead { display: flex; align-items: center; gap: 8px; flex: none; }
.lhead b { font-family: var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltext { flex: 1; min-height: 0; width: 100%; box-sizing: border-box; resize: none; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; font: 15px/1.55 var(--font-body); padding: 12px 14px; }
.lib { --pa: var(--accent); --serif: "Cormorant Garamond", "Palatino Linotype", Georgia, serif; }
.lread { flex: 1; min-height: 0; overflow: auto; padding: 4px 2px 40px; line-height: 1.6; font-size: 16px; scroll-behavior: smooth; }
.lread[hidden], .ltext[hidden] { display: none; }
.doc { max-width: 800px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.dhead { display: grid; gap: 6px; }
.dhead h2 { font: 600 2rem/1.1 var(--serif); margin: 0; letter-spacing: .01em; }
.dhead .flame { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 55%, var(--pa) 0 26%, color-mix(in srgb, var(--pa) 35%, transparent) 46%, transparent 70%); }
.dintro { margin: 0; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 0 14px; font: 600 14px var(--font-body); cursor: pointer; }
.chip.on { border-color: var(--pa); background: color-mix(in srgb, var(--pa) 16%, transparent); }
.dsec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px 18px; scroll-margin-top: 8px; min-width: 0; }
.dsec > :last-child { margin-bottom: 0; }
.doc h3, .csn { font: 600 1.4rem/1.2 var(--serif); margin: 0 0 8px; }
.doc .sech { padding-bottom: 8px; border-bottom: 2px solid color-mix(in srgb, var(--pa) 40%, transparent); margin-bottom: 12px; }
.doc h4 { font: 500 .74rem/1.3 ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
.doc p { margin: 0 0 .7em; max-width: 72ch; }
.doc ul, .doc ol { margin: 0 0 .7em; padding-left: 22px; display: grid; gap: 5px; }
.doc li > ul, .doc li > ol { margin: 5px 0 0; }
.doc blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--pa); color: var(--muted); }
.doc code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.doc hr { border: 0; border-top: 1px solid var(--line); }
.tbl { overflow-x: auto; margin: 0 0 .8em; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 500 .72rem ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ideas { display: grid; gap: 10px; }
.idea { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 12px 16px; display: grid; gap: 8px; min-width: 0; }
.idea.done { opacity: .72; }
.imeta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.itopic { color: var(--c); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.itext p, .ians p { margin: 0 0 .5em; }
.ians { background: color-mix(in srgb, var(--c) 8%, var(--bg)); border-radius: 8px; padding: 10px 14px; display: grid; }
.elab { font: 500 .72rem ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.tl { position: relative; display: grid; gap: 8px; }
.tl::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tli { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; }
.tli .dot { width: 12px; height: 12px; margin: 14px 0 0 5px; border-radius: 50%; background: var(--panel); border: 2px solid var(--pa); box-sizing: border-box; z-index: 1; }
.tli.guess .dot { border-style: dashed; }
.tli.ev .tlb { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; min-width: 0; }
.tli.guess .tlb { border-style: dashed; }
.tli.era { margin-top: 14px; }
.tli.era .dot { width: 14px; height: 14px; margin: 10px 0 0 4px; border: 0; border-radius: 3px; background: var(--pa); transform: rotate(45deg); }
.tle { font: 600 1.45rem/1.2 var(--serif); }
.tlt { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.when { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.tlh { font-weight: 600; overflow-wrap: anywhere; }
.tln { margin: 0; color: var(--muted); font-size: 14.5px; }
.cpick { display: grid; gap: 8px; }
.glab { font: 500 .72rem ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px; }
.csheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; display: grid; gap: 10px; min-width: 0; }
.csn { font-size: 1.7rem; margin: 0; }
.aka { margin: 0; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { border: 1px solid var(--pa); color: var(--pa); border-radius: 999px; padding: 2px 11px; font: 600 13px var(--font-body); }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 18px; margin: 4px 0 0; }
dl.facts dt { font: 500 .72rem/1.9 ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dl.facts dd { margin: 0; }
@media (max-width: 600px) { dl.facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.facts dd { margin-bottom: 8px; } .dsec { padding: 14px 14px 16px; } }
.lnone { color: var(--muted); padding: 24px 4px; }
.lfilter { width: 100%; max-width: 420px; box-sizing: border-box; min-height: 44px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--panel); color: inherit; font: inherit; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding-bottom: 12px; }
.gi { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0; cursor: pointer; aspect-ratio: 1; overflow: hidden; }
.gi img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gi span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; background: rgba(20,22,26,.78); color: #fff; font-size: 11px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(8,9,11,.94); display: flex; flex-direction: column; padding: 10px; gap: 8px; box-sizing: border-box; }
.lightbox[hidden] { display: none; }
.lightbox .lbtop { display: flex; gap: 8px; align-items: center; color: #e8eaee; }
.lightbox .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.45); font-weight: 600; }
.lightbox .btn.danger { background: #c4372f; border-color: #e5645c; color: #fff; }
.lightbox .btn.danger.armed { background: #ff4d42; border-color: #fff; color: #fff; }
.lightbox .lbtop b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lightbox .lbimg { flex: 1; min-height: 0; display: grid; place-items: center; overflow: auto; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
@media (max-width: 720px) { .lbody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .llist { flex-direction: row; overflow-x: auto; } .llist .btn { width: auto; flex: none; max-width: 180px; } }
.empty { max-width: 560px; margin: 40px auto; text-align: center; color: var(--muted); }
.empty h2 { font-family: var(--font-display); color: var(--fg); margin: 0 0 8px; }
.actions { display: flex; gap: 8px; flex: none; max-width: 100%; overflow-x: auto; }
.actions .btn { justify-content: center; flex: none; }
#undo, #redo { min-width: 92px; }
#clean { min-width: 176px; }
#del { min-width: 176px; }
.status { margin-right: auto; width: 230px; max-width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px 4px; min-height: 36px; }
.status.err { color: var(--danger); text-decoration: underline; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:focus-visible, .thumb:focus-visible, .status:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"], .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.sw { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); flex: none; }
.sw.sq { border-radius: 2px; background: transparent; box-shadow: inset 0 0 0 2.5px var(--c); }

.pages { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding-bottom: 6px; }
.thumb { position: relative; flex: none; border: 2px solid var(--line); border-radius: 6px; background: #fff; padding: 0; cursor: pointer; aspect-ratio: 4 / 5; overflow: hidden; width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.thumb[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.thumb .tn { position: absolute; left: 4px; bottom: 4px; min-width: 22px; padding: 1px 6px; border-radius: 10px; background: rgba(20,22,26,.78); color: #fff; font-size: 12px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.addpage { flex: none; min-height: 44px; justify-content: center; border-style: dashed; }

.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.tools { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-bottom: 2px; flex: none; }
.tools .sep { width: 1px; align-self: stretch; background: var(--line); flex: none; margin: 4px 2px; }
.size { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; flex: none; }
.size input { width: 110px; height: 32px; accent-color: var(--accent); }
.shapebar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: none; }
.shapebar[hidden] { display: none; }
.shapebar .grp { display: flex; flex-wrap: wrap; gap: 6px; }
.shapebar .btn { min-height: 44px; min-width: 44px; padding: 0 10px; justify-content: center; }
.shapebar .btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; display: block; }
.shapebar .colr { padding: 0 12px; }
.shapebar .colr.on { box-shadow: 0 0 0 2px var(--accent); background: var(--panel); color: inherit; border-color: var(--accent); }
.scroller { flex: 1; min-height: 0; overflow: auto; background: var(--desk); border-radius: 8px; padding: 16px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; position: relative; }
.sheet { width: max-content; margin: 0 auto; }
canvas { display: block; background: #fff; touch-action: none; box-shadow: 0 2px 14px rgba(0,0,0,.28); cursor: crosshair; -webkit-user-select: none; user-select: none; }
.pagelabel { font-size: 12px; color: var(--muted); margin: 0 0 6px; text-align: center; font-variant-numeric: tabular-nums; }
.notes { flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.notes > button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 500; display: flex; justify-content: space-between; min-height: 44px; box-sizing: border-box; align-items: center; }
.notes > button span { color: var(--muted); font-weight: 400; font-size: 12px; }
.notes textarea { display: block; width: 100%; box-sizing: border-box; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; padding: 10px 12px; resize: vertical; min-height: 84px; max-height: 40vh; }
.notes textarea[hidden] { display: none; }

@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .pages { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 0; }
  .thumb { width: 64px; }
  .addpage { width: 64px; min-height: 0; }
  .scroller { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.login { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--bg); padding: 16px; }
.login[hidden] { display: none; }
.login form { width: min(360px, 100%); display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.login h1 { font-family: var(--font-display); font-size: 20px; margin: 0 0 4px; }
.login label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.login input { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; }
.login .btn { justify-content: center; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.login p { margin: 0; font-size: 13px; color: var(--danger); min-height: 1.2em; }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginform">
    <h1 class="logo"><img src="icon.svg" alt="">moth-lantern</h1>
    <label>Email <input id="em" type="email" autocomplete="username" required></label>
    <label>Password <input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p id="loginerr" role="alert"></p>
  </form>
</div>

<div class="shell">
<header class="gtop">
  <div class="logo"><img src="icon.svg" alt="">moth-lantern</div>
  <button class="btn projchip" id="projchip" type="button" hidden></button>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button class="btn tab" data-view="notebook" type="button">Notebook</button>
    <button class="btn tab" data-view="bible" type="button">Bible</button>
    <button class="btn tab" data-view="sketch" type="button">Sketchbook</button>
  </nav>
  <button class="btn gap" id="signout" type="button">Sign out</button>
</header>

<section class="view choose" id="v-choose" hidden>
  <h2>Choose a project</h2>
  <p class="sub">Notebook, Bible and Sketchbook all open inside the project you pick.</p>
  <div class="cards" id="cards"></div>
</section>

<section class="view lib" id="v-notebook" hidden></section>
<section class="view lib" id="v-bible" hidden></section>

<section class="view app" id="v-sketch" hidden>
  <header class="top">
    <button class="status" id="status" type="button">Loading…</button>
    <div class="actions">
      <button class="btn" id="undo" type="button" disabled>↩ Undo</button>
      <button class="btn" id="redo" type="button" disabled>Redo ↪</button>
      <button class="btn danger" id="clean" type="button">Clean page</button>
      <button class="btn" id="dl" type="button">Save PNG</button>
      <button class="btn danger" id="del" type="button">Delete page</button>
    </div>
  </header>

  <aside class="pages" id="pages" aria-label="Pages"></aside>

  <main class="stage">
    <div class="tools" role="toolbar" aria-label="Drawing tools">
      <button class="btn" data-tool="pen" style="--c:#17181c"><span class="sw" style="--c:#17181c"></span>Pen</button>
      <button class="btn" data-tool="blue" style="--c:#4f86f7"><span class="sw" style="--c:#4f86f7"></span>Blue pencil</button>
      <button class="btn" data-tool="red"><span class="sw" style="--c:#e0443e"></span>Red note</button>
      <button class="btn" data-tool="shape"><span class="sw sq" style="--c:#17181c"></span>Shapes &amp; lines</button>
      <button class="btn" data-tool="panel"><span class="sw sq" style="--c:#17181c"></span>Panel frame</button>
      <button class="btn" data-tool="eraser"><span class="sw" style="--c:#ffffff"></span>Eraser</button>
      <label class="size" for="size">Size <input id="size" type="range" min="2" max="24" value="5"></label>
      <span class="sep"></span>

      if ((w = /^\s*\((.*?)\)(?=\s*(\(guess\)|:|$))/.exec(r))) { if (w[1] === 'guess') guess = true; else when = w[1]; r = r.slice(w[0].length); }
      if (/^\s*\(guess\)/.test(r)) { guess = true; r = r.replace(/^\s*\(guess\)/, ''); }
      if (/^\s*:/.test(r)) note = r.replace(/^\s*:\s*/, '');
      return { title: m[1], when: when, guess: guess, note: note };
    }
    var lead = [];
    function emit(lines, era) {
      lines.forEach(function (ln) { var e = parseEv(ln); if (!e) return;
        row('ev' + (e.guess ? ' guess' : ''), (e.when || e.guess ? '<div class="tlt">' + (e.when ? '<span class="when">' + esc(e.when) + '</span>' : '') + (e.guess ? '<span class="tag">Claude’s guess</span>' : '') + '</div>' : '') + '<div class="tlh">' + inl(e.title) + '</div>' + (e.note ? '<p class="tln">' + inl(e.note) + '</p>' : ''));
      });
    }
    d.secs.forEach(function (s) {
      var when = ''; var lines = s.lines.filter(function (ln) { var m = /^\*(.+)\*$/.exec(ln.trim()); if (m) { when = m[1]; return false; } return true; });
      row('era', '<div class="tle">' + inl(s.h) + '</div>' + (when ? '<span class="when">' + esc(when) + '</span>' : '')); emit(lines);
    });
  }
  function renderChars(el, d, text) {
    var chars = [], group = '', c = null, story = false;
    String(text).split(/\r?\n/).forEach(function (ln) {
      var m;
      if ((m = /^#\s+(.*)$/.exec(ln)) && !/ characters$/.test(m[1])) { group = m[1]; story = false; }
      else if ((m = /^##\s+(.*)$/.exec(ln))) {
        var h = m[1], k = h.lastIndexOf(' ('), name = k > 0 && /\)$/.test(h) ? h.slice(0, k) : h, aka = k > 0 && /\)$/.test(h) ? h.slice(k + 2, -1) : '';
        c = { group: group, name: name, aka: aka, meta: '', facts: [], story: [] }; chars.push(c); story = false;
      } else if (c) {
        if (/^\*\*In the story\*\*/.test(ln)) story = true;
        else if ((m = /^-\s+\*\*(.+?):\*\*\s*(.*)$/.exec(ln)) && !story) c.facts.push([m[1], m[2]]);
        else if ((m = /^-\s+(.*)$/.exec(ln)) && story) c.story.push(m[1]);
        else if (ln.trim() && !story && !c.facts.length && !c.meta) c.meta = ln.trim();
      }
    });
    el.innerHTML = '<div class="doc">' + docHead(d, 'Characters') + '<div class="cpick"></div><article class="csheet"></article></div>';
    var pick = el.querySelector('.cpick'), sheet = el.querySelector('.csheet'), cur = 0;
    function drawPick() {
      pick.textContent = ''; var g = null, row = null;
      chars.forEach(function (ch, i) {
        if (ch.group !== g) { g = ch.group; var lab = document.createElement('div'); lab.className = 'glab'; lab.textContent = g; pick.appendChild(lab); row = document.createElement('div'); row.className = 'chips'; pick.appendChild(row); }
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (i === cur ? ' on' : ''); b.textContent = ch.name.replace(/"/g, '“').replace(/“(.*?)“/g, '“$1”');
        b.addEventListener('click', function () { cur = i; drawPick(); drawSheet(); sheet.scrollIntoView({ block: 'nearest' }); }); row.appendChild(b);
      });
    }
    function drawSheet() {
      var ch = chars[cur]; if (!ch) { sheet.innerHTML = '<div class="lnone">No characters.</div>'; return; }
      var tags = ch.meta ? ch.meta.split(' · ').map(function (t) { return '<span class="badge">' + esc(t) + '</span>'; }).join('') : '';
      sheet.innerHTML = '<h3 class="csn">' + esc(ch.name) + '</h3>' + (ch.aka ? '<p class="aka">' + inl(ch.aka) + '</p>' : '') + (tags ? '<div class="badges">' + tags + '</div>' : '') +
        (ch.facts.length ? '<dl class="facts">' + ch.facts.map(function (f) { return '<dt>' + esc(f[0]) + '</dt><dd>' + inl(f[1]) + '</dd>'; }).join('') + '</dl>' : '') +
        (ch.story.length ? '<h4>In the story</h4><ul>' + ch.story.map(function (s) { return '<li>' + inl(s) + '</li>'; }).join('') + '</ul>' : '');
    }
    drawPick(); drawSheet();
  }
  function renderDoc(el, name, text) {
    var d = splitDoc(text), n = String(name || '').toLowerCase();
    if (n === 'ideas.md' && d.secs.length) renderIdeas(el, d);
    else if (n === 'timeline.md' && d.secs.length) renderTimeline(el, d);
    else if (n === 'characters.md') renderChars(el, d, text);
    else if (d.secs.length) renderSections(el, d, name);
    else el.innerHTML = '<div class="doc">' + mdHtml(text) + '</div>';
  }
  function isText(f) { return /^text\//.test(f.mimeType) || /\.(md|markdown|txt)$/i.test(f.name); }
  function isImage(f) { return /^image\//.test(f.mimeType); }

  var libs = {}, lightbox = null;
  function libFlushAll() { return Promise.all(Object.keys(libs).map(function (k) { return libs[k].flush(); })).then(function (r) { return r.every(Boolean); }); }
  function openLightbox(f, onTrashed) {
    if (!lightbox) {
      lightbox = document.createElement('div'); lightbox.className = 'lightbox'; lightbox.hidden = true;
      lightbox.innerHTML = '<div class="lbtop"><b></b><button class="btn danger" type="button" data-a="trash">Trash</button><button class="btn" type="button" data-a="close">Close</button></div><div class="lbimg"></div>';
      document.body.appendChild(lightbox);
    }
    var nameEl = lightbox.querySelector('b'), box = lightbox.querySelector('.lbimg'), tb = lightbox.querySelector('[data-a=trash]'), cb = lightbox.querySelector('[data-a=close]'), url = null, tt = null;
    function done() { clearTimeout(tt); lightbox.hidden = true; box.textContent = ''; if (url) URL.revokeObjectURL(url); url = null; }
    nameEl.textContent = f.name; box.textContent = 'Loading…'; box.style.color = '#9aa1ad'; lightbox.hidden = false;
    tb.textContent = 'Trash'; tb.classList.remove('armed');
    tb.onclick = function () {
      if (!tb.classList.contains('armed')) { tb.classList.add('armed'); tb.textContent = 'Tap again to trash'; tt = setTimeout(function () { tb.classList.remove('armed'); tb.textContent = 'Trash'; }, 3500); return; }
      trashFile(f.id).then(function () { done(); onTrashed(); }).catch(function (e) { box.textContent = 'Could not trash (' + String(e.message).slice(0, 30) + ')'; });
    };
    cb.onclick = done;
    gfetch(API + 'files/' + f.id + '?alt=media').then(function (r) { return r.blob(); }).then(function (b) {
      if (lightbox.hidden) return; url = URL.createObjectURL(b); var im = new Image(); im.alt = f.name; im.src = url; box.textContent = ''; box.appendChild(im);
    }).catch(function (e) { box.textContent = 'Could not open (' + String(e.message).slice(0, 30) + ')'; });
  }

  function makeLib(el, kind) {
    var MODES = kind === 'bible' ? [{ k: 'notes', label: 'Bible notes', folder: 'bible' }, { k: 'refs', label: 'References', folder: 'references' }] : [{ k: 'notes', label: 'Notes', folder: 'notebook' }];
    var mode = 'notes', files = [], cur = null, dirty = false, timer = null, loadedProj = null, reading = false;
    el.innerHTML = '<div class="lbar"><div class="lmodes" style="display:flex;gap:6px"></div><button class="lstat" type="button"></button><span class="grow"></span><button class="btn lnew" type="button"></button><button class="btn lconn" type="button">Connect Google Drive</button></div><div class="lbody"></div><input type="file" class="lfile" accept="image/*" multiple hidden>';
    var modesEl = el.querySelector('.lmodes'), statEl = el.querySelector('.lstat'), newBtn = el.querySelector('.lnew'), connBtn = el.querySelector('.lconn'), body = el.querySelector('.lbody'), fileIn = el.querySelector('.lfile');
    var ta = null, rd = null, nameEl = null, modeBtn = null, saveBtn = null, trashBtn = null, trashTimer = null;
    function status(t, err) { statEl.textContent = t; statEl.classList.toggle('err', !!err); }
    function folderNames() { var m = MODES.filter(function (x) { return x.k === mode; })[0]; return [DRIVE_ROOT, proj, m.folder]; }
    function fail(e, what) {
      var m = String(e && e.message || e);
      if (/not connected|sign-in|token|Google sign-in/i.test(m) && !gHave()) { renderConnect('Google Drive needs you to sign in again.'); return; }
      status((what || 'Failed') + ' (' + m.slice(0, 40) + '). Tap to retry.', true);
    }
    function renderConnect(msg) {
      connBtn.hidden = false; newBtn.hidden = true; status(''); body.className = 'lbody'; body.style.display = 'block';
      body.innerHTML = '<div class="lnone"></div>'; body.firstChild.textContent = msg || 'Connect Google Drive to open this project’s files.';
    }
    function buildModes() {
      modesEl.textContent = '';
      if (MODES.length < 2) return;
      MODES.forEach(function (m) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (m.k === mode ? ' on' : ''); b.textContent = m.label;
        b.addEventListener('click', function () { if (m.k === mode) return; save().then(function (ok) { if (ok) { mode = m.k; cur = null; buildModes(); load(); } }); });
        modesEl.appendChild(b);
      });
    }
    function save() {
      if (!cur || !dirty) return Promise.resolve(true);
      clearTimeout(timer); var f = cur, text = ta.value; status('Saving…');
      return gfetch(API + 'files/' + f.id + '?fields=modifiedTime').then(function (r) { return r.json(); }).then(function (m) {
        if (f.mod && m.modifiedTime !== f.mod && !confirm('This file was changed in Drive since you opened it. Overwrite it with your version?')) throw new Error('changed elsewhere, not saved');
        return gfetch(UP + 'files/' + f.id + '?uploadType=media&fields=modifiedTime', { method: 'PATCH', headers: { 'Content-Type': 'text/markdown' }, body: text });
      }).then(function (r) { return r.json(); }).then(function (j) {
        f.mod = j.modifiedTime;
        if (cur === f && ta.value === text) { dirty = false; status('Saved ' + clock()); } else if (cur === f) { schedule(); }
        return !dirty;
      }).catch(function (e) { fail(e, 'Save failed'); return false; });
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(save, 1800); }
    function renderList() {
      var box = body.querySelector('.llist'); if (!box) return; box.textContent = '';
      files.forEach(function (f) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = f.name; if (cur && cur.id === f.id) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () { openFile(f); }); box.appendChild(b);
      });
      if (!files.length) { var n = document.createElement('div'); n.className = 'lnone'; n.textContent = 'No notes yet.'; box.appendChild(n); }
    }
    function showReading(on) { reading = on; ta.hidden = on; rd.hidden = !on; modeBtn.textContent = on ? 'Edit' : 'Read'; if (on) { try { renderDoc(rd, cur ? cur.name : '', ta.value); } catch (e) { rd.innerHTML = '<div class="doc">' + mdHtml(ta.value) + '</div>'; } rd.scrollTop = 0; } }
    function openFile(f) {
      return save().then(function (ok) {
        if (!ok) return;
        status('Opening…');
        return Promise.all([gfetch(API + 'files/' + f.id + '?alt=media').then(function (r) { return r.text(); }), gfetch(API + 'files/' + f.id + '?fields=modifiedTime').then(function (r) { return r.json(); })]).then(function (a) {
          cur = f; f.mod = a[1].modifiedTime; dirty = false; ta.value = a[0]; ta.disabled = false; nameEl.textContent = f.name;
          saveBtn.disabled = false; trashBtn.disabled = false; modeBtn.disabled = false; showReading(true); renderList(); status('');
        });
      }).catch(function (e) { fail(e, 'Could not open'); });
    }
    function buildNotes() {
      body.className = 'lbody'; body.style.display = '';
      body.innerHTML = '<aside class="llist"></aside><div class="ledit"><div class="lhead"><b class="lname">Pick a note</b><span class="grow"></span><button class="btn lmode" type="button" disabled>Read</button><button class="btn lsave" type="button" disabled>Save</button><button class="btn danger ltrash" type="button" disabled>Trash</button></div><textarea class="ltext" hidden disabled placeholder="Write here. Markdown works: # heading, **bold**, - list."></textarea><div class="lread"></div></div>';
      ta = body.querySelector('.ltext'); rd = body.querySelector('.lread'); nameEl = body.querySelector('.lname'); modeBtn = body.querySelector('.lmode'); saveBtn = body.querySelector('.lsave'); trashBtn = body.querySelector('.ltrash');
      rd.hidden = false; ta.hidden = true;
      ta.addEventListener('input', function () { dirty = true; status('Unsaved'); schedule(); });
      modeBtn.addEventListener('click', function () { showReading(!reading); });
      saveBtn.addEventListener('click', function () { save(); });
      trashBtn.addEventListener('click', function () {
        if (!cur) return;
        if (!trashBtn.classList.contains('armed')) { trashBtn.classList.add('armed'); trashBtn.textContent = 'Tap again to trash'; trashTimer = setTimeout(function () { trashBtn.classList.remove('armed'); trashBtn.textContent = 'Trash'; }, 3500); return; }
        clearTimeout(trashTimer); var f = cur; dirty = false; clearTimeout(timer);
        trashFile(f.id).then(function () { cur = null; load(); }).catch(function (e) { fail(e, 'Could not trash'); });
      });
      newBtn.textContent = '+ New note'; newBtn.onclick = newNote;
      renderList();
    }
    function newNote() {
      save().then(function (ok) {
        if (!ok) return;
        var name = prompt('Note name', 'untitled'); if (!name) return; name = name.trim(); if (!name) return;
        if (!/\.[a-z0-9]{1,5}$/i.test(name)) name += '.md';
        status('Creating…');
        folderPath(folderNames()).then(function (fid) { return createFile(fid, name, 'text/markdown', ''); }).then(function (f) {
          files.push(f); files.sort(function (a, b) { return a.name.localeCompare(b.name); }); renderList(); return openFile(f).then(function () { showReading(false); ta.focus(); });
        }).catch(function (e) { fail(e, 'Could not create'); });
      });
    }
    function setThumb(im, f) {
      function viaBlob() { im.__job = { id: f.id, im: im }; if (thumbObs) thumbObs.observe(im); else { thumbQ.push(im.__job); thumbPump(); } }
      if (f.thumbnailLink) { im.onerror = function () { im.onerror = null; viaBlob(); }; im.src = f.thumbnailLink.replace(/=s\d+$/, '=s400'); } else viaBlob();
    }
    var refFilter = '';
    function buildRefs() {
      body.className = 'lbody refs'; body.style.display = '';
      body.innerHTML = '<input class="lfilter" type="search" placeholder="Filter by name, e.g. rey or expressions" aria-label="Filter images"><div class="grid"></div>';
      var fin = body.firstChild, grid = body.lastChild; fin.value = refFilter;
      fin.addEventListener('input', function () { refFilter = fin.value; fillGrid(); });
      function fillGrid() {
        grid.textContent = ''; var q = refFilter.trim().toLowerCase(), shown = 0;
        files.forEach(function (f) { if (!q || f.name.toLowerCase().indexOf(q) >= 0) { grid.appendChild(cell(f)); shown++; } });
        status(q ? shown + ' of ' + files.length + ' images' : files.length + (files.length === 1 ? ' file' : ' files'));
      }
      function cell(f) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'gi'; b.setAttribute('aria-label', f.name);
        var im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; var sp = document.createElement('span'); sp.textContent = f.name;
        b.appendChild(im); b.appendChild(sp); setThumb(im, f); b.addEventListener('click', function () { openLightbox(f, load); });
        return b;
      }
      fillGrid();
      if (!files.length) { var n = document.createElement('div'); n.className = 'lnone'; n.textContent = 'No reference images yet. Add some, or drop them in the references folder in Drive.'; body.appendChild(n); }
      newBtn.textContent = '+ Add images'; newBtn.onclick = function () { fileIn.click(); };
    }
    fileIn.addEventListener('change', function () {
      var list = Array.prototype.slice.call(fileIn.files || []); fileIn.value = ''; if (!list.length) return;
      folderPath(folderNames()).then(function (fid) {
        var i = 0, failed = 0;
        function next() {
          if (i >= list.length) return Promise.resolve();
          var f = list[i++]; status('Uploading ' + i + ' of ' + list.length + '…');
          return createFile(fid, f.name, f.type || 'image/png', f).catch(function () { failed++; }).then(next);
        }
        return next().then(function () { return load().then(function () { if (failed) status(failed + ' upload(s) failed. Tap to retry.', true); }); });
      }).catch(function (e) { fail(e, 'Upload failed'); });
    });
    function load() {
      loadedProj = proj; connBtn.hidden = gHave(); newBtn.hidden = false; status('Loading…');
      return folderPath(folderNames()).then(listFiles).then(function (list) {
        files = list.filter(mode === 'refs' ? isImage : isText);
        if (mode === 'refs') buildRefs(); else { cur = null; buildNotes(); }
        if (mode !== 'refs') status(files.length + (files.length === 1 ? ' file' : ' files'));
      }).catch(function (e) { fail(e, 'Could not load'); });
    }
    statEl.addEventListener('click', function () { if (statEl.classList.contains('err')) { if (dirty) save(); else load(); } });
    connBtn.addEventListener('click', function () {
      status('Signing in…'); gConnect().then(function () { connBtn.hidden = true; load(); }).catch(function (e) { renderConnect('Sign-in did not finish (' + String(e.message).slice(0, 40) + '). Tap Connect to try again.'); });
    });
    return {
      show: function () {
        buildModes();
        var pj = projOf(proj); if (pj) el.style.setProperty('--pa', pj.color);
        if (loadedProj && loadedProj !== proj) { cur = null; dirty = false; }
        if (!gHave()) { renderConnect(); return; }
        load();
      },
      flush: function () { return save(); }
    };
  }
  libs.notebook = makeLib(document.getElementById('v-notebook'), 'notebook');
  libs.bible = makeLib(document.getElementById('v-bible'), 'bible');
  window.addEventListener('pagehide', function () { Object.keys(libs).forEach(function (k) { libs[k].flush(); }); });

  /* ---------- sign in / boot ---------- */
  var loginEl = document.getElementById('login'), started = false;
  function showLogin(msg) { loginEl.hidden = false; document.getElementById('loginerr').textContent = msg || ''; }
  function boot(session) {
    if (started) return; started = true;
    uid = session.user.id; db = makeDb(); assets = makeAssets(); loginEl.hidden = true;
    var timer = setTimeout(function () { setStatus('Still reaching your saved pages…'); }, 10000);
    db.list().then(function (list) { clearTimeout(timer); start(list); })
      .catch(function (err) { clearTimeout(timer); db = null; setStatus('Could not reach saved pages (' + String(err && err.message || err).slice(0, 40) + '). Tap to retry.', true); start([]); });
  }
  document.getElementById('loginform').addEventListener('submit', function (e) {
    e.preventDefault(); document.getElementById('loginerr').textContent = 'Signing in…';
    sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function (r) {
      if (r.error) { showLogin(r.error.message); return; }
      boot(r.data.session);
    });
  });
  document.getElementById('signout').addEventListener('click', function () {
    flush().then(function () { return sb.auth.signOut(); }).then(function () { location.reload(); });
  });
  fit(); updateButtons(); renderThumbs();
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) boot(r.data.session); else showLogin(''); })
    .catch(function () { showLogin('Could not reach the server.'); });
})();
